<!doctype html>

<body>
<div class="embed-src" id="embedSrc" hidden></div>
<div class="blackout" id="blackout" data-i18n="blackout"></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#5b2cff"/><stop offset=".6" stop-color="#ff3d7f"/><stop offset="1" stop-color="#ff8a00"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><circle cx="16" cy="16" r="3.4" fill="#fff"/><circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-width="2.2" opacity=".85"/><circle cx="16" cy="16" r="12.5" fill="none" stroke="#fff" stroke-width="1.8" opacity=".45"/></svg>
      <span>La <b>Sonde</b></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#course" data-i18n="nav.race"></a>
      <a href="#bascule" data-i18n="nav.bascule"></a>
      <a href="#etsi" data-i18n="nav.whatif"></a>
      <a href="#second" data-i18n="nav.round2"></a>
      <a href="#candidats" data-i18n="nav.cands"></a>
    </nav>
    <details class="navmore" id="navMore">
      <summary><span class="lbl-more" data-i18n="nav.more"></span><span class="lbl-menu" data-i18n="nav.menu"></span></summary>
      <div class="menu">
        <a href="#course" data-i18n="nav.race" class="p"></a>
        <a href="#bascule" data-i18n="nav.bascule" class="p"></a>
        <a href="#etsi" data-i18n="nav.whatif" class="p"></a>
        <a href="#second" data-i18n="nav.round2" class="p"></a>
        <a href="#candidats" data-i18n="nav.cands" class="p"></a>
        <a href="#proba" data-i18n="nav.proba"></a>
        <a href="#fantomes" data-i18n="nav.ghosts"></a>
        <a href="#reports" data-i18n="nav.transfers"></a>
        <a href="#debats" data-i18n="nav.debates"></a>
        <a href="#enjeux" data-i18n="nav.issues"></a>

        <a href="#methode" data-i18n="nav.method"></a>
      </div>

    <div class="tools">
      <a class="pill donate" id="donateTop" target="_blank" rel="noopener"><span aria-hidden="true">♥</span> <span data-i18n="don.short"></span></a>
      <select class="pill langsel" id="langSel" aria-label="Langue / Language"><option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option><option value="es">ES</option><option value="it">IT</option></select>
      <button class="pill" id="themeBtn" aria-label="Mode clair / sombre"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" style="display:block"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <div>
      <span class="kicker"><span class="live"></span><span data-i18n="hero.kicker"></span></span>
      <h1 data-i18n="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="countdown" id="countdown"></div>
      <a class="btn-hero-don" id="donateHero" target="_blank" rel="noopener"><span aria-hidden="true">♥</span> <span data-i18n="don.hero"></span></a>
      <a class="livebar" id="liveBar" href="#debats" hidden></a>
    </div>
    <div class="podium" id="podium"></div>
  </div>
</div>

<main class="wrap">
  <section id="resume" style="padding-top:28px">
    <div class="changes" id="changes"></div>
    <details class="read sumd">
      <summary><span data-i18n="sum.title"></span></summary>
      <ul id="summary"></ul>
      <div class="meta" id="sumMeta"></div>
    </details>
  </section>

  <section id="bascule">
    <div class="sh"><div><div class="tag" data-i18n="bas.tag"></div><h2 data-i18n="bas.title"></h2><p data-i18n="bas.desc"></p></div></div>
    <div class="grid2">
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="bas.mom"></h3><p class="note" style="margin:0 0 12px" data-i18n="bas.momDesc"></p><div class="mom" id="momList"></div></div>
      <div class="bstack">
        <div class="card baro" id="baro"></div>
        <div class="card" id="alerts"></div>
      </div>
    </div>
    <div class="card" id="projCard" style="margin-top:18px">
      <h3 style="margin:0 0 4px" data-i18n="bas.proj"></h3><p class="note" style="margin:0 0 10px" data-i18n="bas.projDesc"></p>
      <div class="chips" id="projChips"></div>
      <div class="chart" id="projChart"></div>
      <div class="legend"><span><i></i><span data-i18n="bas.lgObs"></span></span><span><i class="dash"></i><span data-i18n="bas.lgProj"></span></span><span><i style="border:0;height:10px;width:18px;background:var(--surface-2);border-radius:3px"></i><span data-i18n="bas.lgCone"></span></span></div>
    </div>
    <div class="warnbox"><strong>⚠︎</strong><span data-i18n="bas.warn"></span></div>
  </section>

  <section id="course">
    <div class="sh"><div><div class="tag" data-i18n="race.tag"></div><h2 data-i18n="race.title"></h2><p data-i18n="race.desc"></p></div></div>
    <div class="card">
      <div class="controls">
        <div class="seg" id="rangeSeg"></div>
        <label class="toggle"><input type="checkbox" id="dotsTgl" checked> <span data-i18n="race.dots"></span></label>
        <label class="toggle"><input type="checkbox" id="evTgl" checked> <span data-i18n="race.events"></span></label>
      </div>
      <div class="chips" id="chips"></div>
      <div class="chart" id="raceChart"></div>
      <div class="legend"><span><i></i><span data-i18n="race.lgLine"></span></span><span><i style="border:0;height:10px;width:18px;background:var(--surface-2);border-radius:3px"></i><span data-i18n="race.lgBand"></span></span><span><i style="border:0;width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.5"></i><span data-i18n="race.lgDot"></span></span></div>
      <h4 style="margin:18px 0 6px" data-i18n="tab.title"></h4><div class="scroll" id="allTable"></div>
      <p class="note" data-i18n="race.note"></p>
      <div class="embed-tool" data-embed="course"></div>
    </div>
  </section>

  <section id="candidats">
    <div class="sh"><div><div class="tag" data-i18n="cf.tag"></div><h2 data-i18n="cf.title"></h2><p data-i18n="cf.desc"></p></div></div>
    <div class="cfiches" id="cfiches"></div>
  </section>

  <section id="etsi">
    <div class="sh"><div><div class="tag" data-i18n="wi.tag"></div><h2 data-i18n="wi.title"></h2><p data-i18n="wi.desc"></p></div></div>
    <div class="grid2">
      <div class="card">
        <h3 style="margin:0 0 4px" data-i18n="wi.who"></h3><p class="note" style="margin:0 0 10px" data-i18n="wi.whoDesc"></p>
        <div class="chips" id="wiChips"></div>
        <h4 style="margin:16px 0 8px" data-i18n="wi.examples"></h4>
        <div class="wipre" id="wiPresets"></div>
        <div class="wilegend"><span class="wib poll" data-i18n="wi.lvPoll"></span> <span data-i18n="wi.lgPoll"></span><br><span class="wib meas" data-i18n="wi.lvMeas"></span> <span data-i18n="wi.lgMeas"></span><br><span class="wib est" data-i18n="wi.lvEst"></span> <span data-i18n="wi.lgEst"></span></div>
      </div>
      <div class="card"><h3 style="margin:0 0 10px" data-i18n="wi.res"></h3><div id="wiRes"></div><p class="note" id="wiNote"></p></div>
    </div>
    <div class="warnbox"><strong>⚠︎</strong><span data-i18n="wi.warn"></span></div>
  </section>

  <section id="second">
    <div class="sh"><div><div class="tag" data-i18n="r2.tag"></div><h2 data-i18n="r2.title"></h2><p data-i18n="r2.desc"></p></div></div>
    <div class="grid2">
      <div class="card"><h3 style="margin:0 0 6px" data-i18n="r2.polls"></h3><div id="duels"></div></div>
      <div class="card" id="sim">
        <h3 style="margin:0 0 6px" data-i18n="r2.sim"></h3>
        <p class="note" style="margin:0 0 10px" data-i18n="r2.simDesc"></p>
        <div class="row"><label class="field"><span data-i18n="r2.finA"></span><select id="simA"></select></label><label class="field"><span data-i18n="r2.finB"></span><select id="simB"></select></label><button class="pill" id="simReset" data-i18n="r2.reset"></button></div>
        <div class="sim-res" id="simRes"></div>
        <p class="note" id="simCmp" style="margin-top:0"></p>
        <div id="simRows"></div>
      </div>
    </div>
  </section>

  <section id="proba">
    <div class="sh"><div><div class="tag" data-i18n="proba.tag"></div><h2 data-i18n="proba.title"></h2><p data-i18n="proba.desc"></p></div></div>
    <div class="controls"><div class="seg" id="scenSeg"></div></div>
    <p class="condnote"><strong>ⓘ</strong> <span data-i18n="proba.cond"></span></p>
    <div class="grid2">
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="proba.qualif"></h3><p class="note" style="margin:0 0 10px" id="scenDesc"></p><div id="qualif"></div></div>
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="proba.win"></h3><p class="note" style="margin:0 0 10px" data-i18n="proba.winDesc"></p><div id="winp"></div><h4 style="margin:18px 0 4px" data-i18n="proba.duels"></h4><div id="duelp"></div></div>
    </div>
    <div class="warnbox"><strong>⚠︎</strong><span data-i18n="proba.warn"></span></div>
    <div class="embed-tool" data-embed="proba"></div>
  </section>

  <section id="fantomes">
    <div class="sh"><div><div class="tag" data-i18n="ghost.tag"></div><h2 data-i18n="ghost.title"></h2><p data-i18n="ghost.desc"></p></div></div>
    <div class="card">
      <div class="chips" id="ghostChips"></div>
      <div class="chart" id="ghostChart"></div>
      <div class="legend"><span><i></i><span data-i18n="ghost.lg27"></span></span><span><i class="dash"></i><span data-i18n="ghost.lg22"></span></span><span><i style="border:0;width:9px;height:9px;border-radius:50%;background:var(--ink-2)"></i><span data-i18n="ghost.lgRes"></span></span></div>
      <p class="note" id="ghostNote"></p>
      <div class="embed-tool" data-embed="fantomes"></div>
    </div>
  </section>

  <section id="reports">
    <div class="sh"><div><div class="tag" data-i18n="tr.tag"></div><h2 data-i18n="tr.title"></h2><p data-i18n="tr.desc"></p></div></div>
    <div class="card" id="transfers"></div>
  </section>



  <section id="debats">
    <div class="sh"><div><div class="tag" data-i18n="deb.tag"></div><h2 data-i18n="deb.title"></h2><p data-i18n="deb.desc"></p></div></div>
    <div class="card debate" id="debate"></div>
  </section>

  <section id="ecart">
    <div class="sh"><div><div class="tag" data-i18n="gap.tag"></div><h2 data-i18n="gap.title"></h2><p data-i18n="gap.desc"></p></div></div>
    <div class="card">
      <div class="row">
        <label class="field"><span data-i18n="gap.a"></span><select id="gapA"></select></label>
        <label class="field"><span data-i18n="gap.b"></span><select id="gapB"></select></label>
        <label class="field" style="flex:1;min-width:220px"><span><span data-i18n="gap.n"></span> : <b id="gapNv" class="num"></b></span><input type="range" id="gapN" min="500" max="15000" step="100" value="1000"></label>
      </div>
      <div class="gap-out" id="gapOut"></div>
    </div>
  </section>

  <section id="enjeux">
    <div class="sh"><div><div class="tag" data-i18n="is.tag"></div><h2 data-i18n="is.title"></h2><p data-i18n="is.desc"></p></div></div>
    <div class="grid2">
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="is.baro"></h3><p class="note" style="margin:0 0 6px" id="baroDesc"></p><div class="chart" id="concernChart"></div><p class="note" id="baroSrc"></p></div>
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="is.stakes"></h3><p class="note" style="margin:0 0 6px" id="stakesDesc"></p><div id="stakes"></div></div>
    </div>
    <div class="read" style="margin-top:18px"><h3 data-i18n="is.byElec"></h3><div id="byElec"></div></div>
  </section>


  <section id="quiz">
    <div class="sh"><div><div class="tag" data-i18n="qz.tag"></div><h2 data-i18n="qz.title"></h2><p data-i18n="qz.desc"></p></div></div>
    <div class="grid2">
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="qz.pick"></h3><p class="note" style="margin:0 0 12px" id="qzCount"></p><div class="chips" id="qzThemes"></div></div>
      <div class="card"><h3 style="margin:0 0 4px" data-i18n="qz.res"></h3><p class="note" style="margin:0 0 12px" data-i18n="qz.resDesc"></p><div id="qzRes"></div></div>
    </div>
  </section>

  <section id="sondages">
    <div class="sh"><div><div class="tag" data-i18n="po.tag"></div><h2 data-i18n="po.title"></h2><p data-i18n="po.desc"></p></div></div>
    <div class="card decoded" id="decoded"></div>
    <div class="card" style="margin-top:18px"><div class="polls" id="pollList"></div></div>
    <h3 style="margin:28px 0 12px;font:800 24px var(--display)" data-i18n="ins.title"></h3><div class="inst-grid" id="insts"></div>
    <div class="card" style="margin-top:18px"><h3 style="margin:0 0 4px" data-i18n="po.house"></h3><p class="note" style="margin:0 0 10px" data-i18n="po.houseDesc"></p><div class="scroll" id="house"></div></div>
  </section>


  <section id="frise">
    <div class="sh"><div><div class="tag" data-i18n="tl.tag"></div><h2 data-i18n="tl.title"></h2><p data-i18n="tl.desc"></p></div></div>
    <div class="card"><ol class="timeline" id="timeline"></ol></div>
  </section>

  <section id="methode">
    <div class="sh"><div><div class="tag" data-i18n="me.tag"></div><h2 data-i18n="me.title"></h2></div></div>
    <div class="read" id="method"></div>
  </section>

  <section id="soutenir">
    <div class="grid2">
      <div class="support"><h3 data-i18n="don.title"></h3><p data-i18n="don.text"></p><a class="btn-don" id="donateBtn" target="_blank" rel="noopener"><span aria-hidden="true">♥</span> <span data-i18n="don.cta"></span></a></div>
      <div class="card"><h3 style="margin:0 0 6px" data-i18n="media.title"></h3><p style="margin:0 0 8px;color:var(--ink-2)" data-i18n="media.text"></p><p style="margin:0" class="note"><span data-i18n="media.contact"></span> <b id="contactMail" style="user-select:all;color:var(--ink)"></b></p></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap grid3">
    <div><h3>La Sonde</h3><p data-i18n="ft.about"></p><p id="ftAuthor"></p></div>
    <div><h3 data-i18n="ft.legalT"></h3><p data-i18n="ft.legal"></p></div>
    <div><h3 data-i18n="ft.dataT"></h3><p data-i18n="ft.data"></p><p id="ftGen"></p></div>
  </div>
</footer>

<script src="vendor/d3.min.js"></script>
<script src="i18n.js"></script>
<script src="i18n-de.js"></script>
<script src="i18n-es.js"></script>
<script src="i18n-it.js"></script>
<script src="debate.js"></script>
<script src="app.js"></script>
</body>
</html>
